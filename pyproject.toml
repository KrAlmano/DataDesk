[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datadesk"
version = "1.2.0"
description = "Excel ve CSV dosyaları için yerel masaüstü filtreleme ve düzenleme aracı"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KrAlmano"}]
dependencies = [
    "PySide6-Essentials>=6.8,<7,!=6.12.0; python_version < '3.12'",
    "PySide6-Essentials>=6.8,<7; python_version >= '3.12'",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.19,<7",
    "Pillow>=11,<13",
]
dev = [
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.11,<1",
    "xlwt>=1.3,<2",
]

[project.gui-scripts]
datadesk = "datadesk.app:main"

[project.urls]
Repository = "https://github.com/KrAlmano/DataDesk"
Issues = "https://github.com/KrAlmano/DataDesk/issues"

[tool.setuptools.packages.find]
include = ["datadesk*"]

[tool.setuptools.package-data]
datadesk = ["assets/*.svg", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/qt/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

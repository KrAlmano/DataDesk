name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libdbus-1-3 libxkbcommon0
      - name: Install DataDesk and test tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test data engine, file round trips and interface
        run: python -m pytest -q
